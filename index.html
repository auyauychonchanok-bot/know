<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>รู้อ่านตัวเลข</title>
    <style>
        /* ==========================================
           1. CORE STYLES & RESPONSIVE CONTAINER
           ========================================== */
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            user-select: none;
            font-family: 'Kanit', 'Prompt', 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        body, html {
            width: 100%;
            height: 100%;
            overflow: hidden;
            background-color: #0b1d16;
            color: #ffffff;
        }

        #game-container {
            position: relative;
            width: 100vw;
            height: 100vh;
            max-width: 1280px;
            max-height: 720px;
            margin: 0 auto;
            top: 50%;
            transform: translateY(-50%);
            overflow: hidden; /* ล็อคขอบไม่ให้ภาพซูมหลุดเฟรม */
            box-shadow: 0 0 50px rgba(0, 0, 0, 0.8);
            border-radius: 12px;
        }

        /* Ambient Light & Sparkle Animation */
        .sunflare-overlay {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            z-index: 5;
            background: radial-gradient(circle at 80% 20%, rgba(255, 230, 150, 0.25) 0%, rgba(255, 255, 255, 0) 60%);
            animation: ambientGlow 4s infinite alternate ease-in-out;
        }

        @keyframes ambientGlow {
            0% { opacity: 0.5; transform: scale(1); }
            50% { opacity: 0.85; transform: scale(1.05); }
            100% { opacity: 0.6; transform: scale(1); }
        }

        .sparkle {
            position: absolute;
            width: 6px;
            height: 6px;
            background: #fff;
            border-radius: 50%;
            box-shadow: 0 0 10px #ffea79, 0 0 20px #ffea79;
            animation: sparkleFloat 5s infinite linear;
            pointer-events: none;
            z-index: 6;
        }

        @keyframes sparkleFloat {
            0% { transform: translateY(100vh) rotate(0deg); opacity: 0; }
            20% { opacity: 0.8; }
            80% { opacity: 0.8; }
            100% { transform: translateY(-10vh) rotate(360deg); opacity: 0; }
        }

        /* Top Bar UI & LOGO (t.png) */
        .top-bar {
            position: absolute;
            top: 15px;
            left: 20px;
            right: 20px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            z-index: 30;
        }

        .top-bar-left {
            display: flex;
            align-items: center;
            gap: 15px;
        }

        .app-logo {
            height: 45px; /* ขนาดพอดีสมดุลกับแถบเมนู */
            width: auto;
            object-fit: contain;
            filter: drop-shadow(0 4px 8px rgba(0,0,0,0.5));
            transition: transform 0.3s ease;
        }

        .app-logo:hover {
            transform: scale(1.05);
        }

        .sound-btn {
            background: rgba(0, 0, 0, 0.6);
            border: 2px solid #55e6c1;
            color: #fff;
            font-size: 22px;
            width: 45px;
            height: 45px;
            border-radius: 50%;
            cursor: pointer;
            backdrop-filter: blur(5px);
            transition: all 0.2s ease;
            display: flex;
            align-items: center;
            justify-content: center;
            box-shadow: 0 4px 15px rgba(0, 255, 170, 0.3);
        }

        .sound-btn:hover {
            transform: scale(1.1);
            background: rgba(85, 230, 193, 0.3);
        }

        .score-badge {
            background: rgba(15, 30, 45, 0.85);
            border: 2px solid #f6b93b;
            padding: 8px 20px;
            border-radius: 20px;
            font-size: 18px;
            font-weight: bold;
            color: #fffa65;
            box-shadow: 0 4px 15px rgba(246, 185, 59, 0.4);
            backdrop-filter: blur(5px);
        }

        /* ==========================================
           2. START SCREEN (SMOOTH BACKGROUND ZOOM)
           ========================================== */
        #start-screen {
            position: absolute;
            inset: 0;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            z-index: 50;
            text-align: center;
            overflow: hidden;
        }

        /* Layer ภาพพื้นหลังหน้าแรก พร้อม animation ซูมเข้า-ออกนุ่มนวล */
        .bg-start-layer {
            position: absolute;
            inset: 0;
            background: linear-gradient(rgba(0,0,0,0.3), rgba(0,0,0,0.6)), url('z1.png') center/cover no-repeat;
            z-index: -1;
            animation: smoothBgZoom 8s infinite alternate ease-in-out;
            transform-origin: center center;
        }

        @keyframes smoothBgZoom {
            0% { transform: scale(1); }
            100% { transform: scale(1.08); } /* ซูมเข้าเล็กน้อยอย่างนุ่มนวล ไม่หลุดเฟรม */
        }

        .game-title {
            font-size: 56px;
            font-weight: 900;
            color: #fff;
            text-shadow: 0 0 20px #00d2d3, 0 0 40px #54a0ff, 4px 4px 0px #000;
            margin-bottom: 10px;
            letter-spacing: 2px;
            animation: pulseTitle 2s infinite alternate;
        }

        .game-subtitle {
            font-size: 22px;
            color: #55e6c1;
            text-shadow: 2px 2px 4px #000;
            margin-bottom: 40px;
            background: rgba(0, 0, 0, 0.5);
            padding: 6px 20px;
            border-radius: 30px;
            border: 1px solid rgba(85, 230, 193, 0.5);
        }

        @keyframes pulseTitle {
            0% { transform: scale(1); filter: drop-shadow(0 0 15px #00d2d3); }
            100% { transform: scale(1.03); filter: drop-shadow(0 0 30px #54a0ff); }
        }

        .btn-start {
            padding: 18px 50px;
            font-size: 26px;
            font-weight: bold;
            color: #fff;
            background: linear-gradient(135deg, #10ac84, #1dd1a1);
            border: 3px solid #fffa65;
            border-radius: 50px;
            cursor: pointer;
            box-shadow: 0 10px 25px rgba(29, 209, 161, 0.5), inset 0 2px 5px #fff;
            transition: all 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275);
            text-shadow: 1px 2px 3px rgba(0,0,0,0.5);
        }

        .btn-start:hover {
            transform: translateY(-5px) scale(1.05);
            box-shadow: 0 15px 30px rgba(29, 209, 161, 0.8), inset 0 2px 5px #fff;
            background: linear-gradient(135deg, #1dd1a1, #10ac84);
        }

        /* ==========================================
           3. GAMEPLAY & MAP SYSTEM (SMOOTH BG ZOOM)
           ========================================== */
        #gameplay-screen {
            position: absolute;
            inset: 0;
            display: none;
            overflow: hidden;
        }

        /* Layer ภาพพื้นหลังหน้าเล่นเกม */
        .bg-gameplay-layer {
            position: absolute;
            inset: 0;
            background: url('z2.png') center/cover no-repeat;
            z-index: 1;
            animation: smoothBgZoom 10s infinite alternate ease-in-out;
            transform-origin: center center;
        }

        #map-viewport {
            position: absolute;
            width: 100%;
            height: 100%;
            z-index: 2;
            transition: transform 0.8s cubic-bezier(0.25, 1, 0.5, 1);
            transform-origin: center center;
        }

        #path-canvas {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            z-index: 2;
        }

        /* Map Nodes */
        .map-node {
            position: absolute;
            width: 58px;
            height: 58px;
            margin-left: -29px;
            margin-top: -29px;
            border-radius: 50%;
            background: #222f3e;
            border: 3px solid #c8d6e5;
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: bold;
            font-size: 22px;
            color: #fff;
            z-index: 10;
            box-shadow: 0 6px 15px rgba(0,0,0,0.5);
            transition: all 0.3s ease;
            opacity: 0.6;
        }

        .map-node.boss-node {
            width: 74px;
            height: 74px;
            margin-left: -37px;
            margin-top: -37px;
            background: linear-gradient(135deg, #ff9f43, #ee5253);
            border: 4px solid #fffa65;
            font-size: 30px;
        }

        .map-node.correct {
            opacity: 1;
            background: #10ac84 !important;
            border-color: #55e6c1 !important;
            color: #fff !important;
            box-shadow: 0 0 20px #55e6c1, 0 0 40px #10ac84 !important;
            font-size: 26px;
        }

        .map-node.wrong {
            opacity: 1;
            background: #ee5253 !important;
            border-color: #ff6b6b !important;
            color: #fff !important;
            box-shadow: 0 0 20px #ff6b6b, 0 0 40px #ee5253 !important;
            font-size: 26px;
        }

        /* Character Sprites */
        #hero-character {
            position: absolute;
            width: 60px;
            height: 70px;
            margin-left: -30px;
            margin-top: -60px;
            z-index: 15;
            transition: left 0.8s ease-in-out, top 0.8s ease-in-out;
            pointer-events: none;
            filter: drop-shadow(0 8px 6px rgba(0,0,0,0.6));
        }

        .hero-svg {
            width: 100%;
            height: 100%;
            animation: heroIdle 1.5s infinite ease-in-out alternate;
        }

        @keyframes heroIdle {
            0% { transform: translateY(0); }
            100% { transform: translateY(-6px); }
        }

        #boss-character {
            position: absolute;
            width: 90px;
            height: 90px;
            margin-left: -45px;
            margin-top: -75px;
            z-index: 14;
            display: none;
            filter: drop-shadow(0 10px 10px rgba(0,0,0,0.7));
        }

        .fireball {
            position: absolute;
            width: 30px;
            height: 30px;
            background: radial-gradient(circle, #fffa65 20%, #ff9f43 60%, #ee5253 90%);
            border-radius: 50%;
            box-shadow: 0 0 20px #ff9f43, 0 0 35px #ee5253;
            z-index: 16;
            opacity: 0;
            pointer-events: none;
        }

        /* ==========================================
           4. INTERACTIVE QUIZ UI (CENTERED MODAL)
           ========================================== */
        #quiz-modal {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%) scale(0.9);
            width: 90%;
            max-width: 620px;
            background: rgba(16, 29, 39, 0.94);
            border: 3px solid #54a0ff;
            border-radius: 24px;
            padding: 25px 30px;
            z-index: 25;
            box-shadow: 0 20px 50px rgba(0, 0, 0, 0.7), inset 0 0 20px rgba(84, 160, 255, 0.2);
            backdrop-filter: blur(12px);
            opacity: 0;
            pointer-events: none;
            transition: all 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275);
            text-align: center;
        }

        #quiz-modal.active {
            opacity: 1;
            pointer-events: auto;
            transform: translate(-50%, -50%) scale(1);
        }

        .quiz-header {
            font-size: 18px;
            color: #55e6c1;
            font-weight: bold;
            margin-bottom: 12px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 2px solid rgba(255, 255, 255, 0.1);
            padding-bottom: 8px;
        }

        .quiz-question-box {
            background: rgba(0, 0, 0, 0.4);
            border: 2px solid rgba(84, 160, 255, 0.4);
            border-radius: 16px;
            padding: 20px;
            margin-bottom: 20px;
            min-height: 80px;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .quiz-question-text {
            font-size: 30px;
            font-weight: bold;
            color: #fffa65;
            line-height: 1.3;
            text-shadow: 2px 2px 4px rgba(0,0,0,0.8);
        }

        .quiz-options-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 15px;
        }

        @media (max-width: 600px) {
            .quiz-options-grid {
                grid-template-columns: 1fr;
            }
        }

        .option-btn {
            background: linear-gradient(135deg, #2e86de, #0984e3);
            border: 2px solid #74b9ff;
            color: #ffffff;
            font-size: 22px;
            font-weight: bold;
            padding: 14px 20px;
            border-radius: 14px;
            cursor: pointer;
            transition: all 0.2s ease;
            box-shadow: 0 4px 12px rgba(9, 132, 227, 0.4);
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .option-btn:hover {
            transform: translateY(-3px);
            background: linear-gradient(135deg, #0984e3, #48dbfb);
            border-color: #fffa65;
            box-shadow: 0 8px 20px rgba(72, 219, 251, 0.6);
        }

        .option-btn:active {
            transform: translateY(1px);
        }

        /* ==========================================
           5. GAME OVER & VICTORY SCREEN
           ========================================== */
        #result-screen {
            position: absolute;
            inset: 0;
            background: rgba(10, 20, 30, 0.95);
            display: none;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            z-index: 60;
            text-align: center;
            backdrop-filter: blur(10px);
        }

        #fireworks-canvas {
            position: absolute;
            inset: 0;
            pointer-events: none;
            z-index: 61;
        }

        .result-box {
            position: relative;
            z-index: 62;
            background: rgba(255, 255, 255, 0.05);
            border: 3px solid #54a0ff;
            border-radius: 30px;
            padding: 40px 50px;
            max-width: 500px;
            width: 85%;
            box-shadow: 0 15px 40px rgba(0,0,0,0.8);
        }

        .result-title {
            font-size: 42px;
            font-weight: 900;
            margin-bottom: 15px;
        }

        .result-title.win {
            color: #1dd1a1;
            text-shadow: 0 0 20px #1dd1a1;
        }

        .result-title.lose {
            color: #ff6b6b;
            text-shadow: 0 0 20px #ff6b6b;
        }

        .result-score {
            font-size: 26px;
            color: #fff;
            margin-bottom: 25px;
        }

        .result-score span {
            color: #fffa65;
            font-size: 34px;
            font-weight: bold;
        }

        .btn-restart {
            padding: 14px 40px;
            font-size: 22px;
            font-weight: bold;
            color: #fff;
            background: linear-gradient(135deg, #2e86de, #54a0ff);
            border: 2px solid #fff;
            border-radius: 35px;
            cursor: pointer;
            box-shadow: 0 6px 20px rgba(84, 160, 255, 0.5);
            transition: all 0.3s ease;
        }

        .btn-restart:hover {
            transform: scale(1.05);
            background: linear-gradient(135deg, #54a0ff, #2e86de);
        }
    </style>
</head>
<body>

    <div id="game-container">
        <!-- Sun Flare & Ambient Lighting Effects -->
        <div class="sunflare-overlay"></div>
        <div id="sparkle-container"></div>

        <!-- Top Bar WITH LOGO (t.png) -->
        <div class="top-bar">
            <div class="top-bar-left">
                <!-- โลโก้ t.png มุมบนซ้าย -->
                <img src="t.png" alt="Logo" class="app-logo">
                <button class="sound-btn" id="toggle-sound" title="เปิด/ปิดเสียง">🔊</button>
            </div>
            <div class="score-badge">คะแนน: <span id="current-score">0</span> / 10</div>
        </div>

        <!-- 1. START SCREEN -->
        <div id="start-screen">
            <!-- Background Layer หน้าแรก แบบซูมนุ่มนวล -->
            <div class="bg-start-layer"></div>
            
            <h1 class="game-title">รู้อ่านตัวเลข</h1>
            <div class="game-subtitle">เกมคณิตศาสตร์โรบอก ทิวภูเขา</div>
            <button class="btn-start" id="btn-start-game">▶ เริ่มผจญภัย</button>
        </div>

        <!-- 2. GAMEPLAY AREA & MAP -->
        <div id="gameplay-screen">
            <!-- Background Layer หน้าเกม แบบซูมนุ่มนวล -->
            <div class="bg-gameplay-layer"></div>

            <div id="map-viewport">
                <canvas id="path-canvas"></canvas>

                <!-- Robox Hero Warrior Sprite -->
                <div id="hero-character">
                    <svg class="hero-svg" viewBox="0 0 100 120" xmlns="http://www.w3.org/2000/svg">
                        <rect x="25" y="10" width="50" height="45" rx="8" fill="#2e86de" stroke="#10ac84" stroke-width="4"/>
                        <rect x="33" y="22" width="34" height="18" rx="4" fill="#0b1d16"/>
                        <circle cx="43" cy="31" r="4" fill="#55e6c1"/>
                        <circle cx="57" cy="31" r="4" fill="#55e6c1"/>
                        <polygon points="15,15 25,25 25,10" fill="#fffa65"/>
                        <polygon points="85,15 75,25 75,10" fill="#fffa65"/>
                        <rect x="30" y="58" width="40" height="40" rx="6" fill="#10ac84" stroke="#fffa65" stroke-width="3"/>
                        <circle cx="50" cy="78" r="8" fill="#ee5253"/>
                        <rect x="75" y="45" width="8" height="40" fill="#c8d6e5" rx="2"/>
                        <polygon points="79,35 73,45 85,45" fill="#f6b93b"/>
                    </svg>
                </div>

                <!-- Boss Bandit Sprite -->
                <div id="boss-character">
                    <svg viewBox="0 0 120 120" xmlns="http://www.w3.org/2000/svg">
                        <rect x="20" y="15" width="80" height="60" rx="12" fill="#222f3e" stroke="#ee5253" stroke-width="5"/>
                        <line x1="30" y1="35" x2="90" y2="50" stroke="#000" stroke-width="6"/>
                        <circle cx="45" cy="42" r="7" fill="#ee5253"/>
                        <rect x="5" y="50" width="30" height="16" fill="#576574" rx="4"/>
                        <rect x="0" y="46" width="10" height="24" fill="#ff9f43"/>
                    </svg>
                </div>

                <!-- Fireball FX -->
                <div id="boss-fireball" class="fireball"></div>
            </div>

            <!-- Quiz Overlay Modal (Centered) -->
            <div id="quiz-modal">
                <div class="quiz-header">
                    <span id="quiz-stage-title">ด่านที่ 1</span>
                    <span id="quiz-topic">รู้อ่านตัวเลข</span>
                </div>
                <div class="quiz-question-box">
                    <div id="quiz-question-text" class="quiz-question-text">คำถาม...</div>
                </div>
                <div class="quiz-options-grid" id="quiz-options-container">
                    <!-- Dynamic Option Buttons -->
                </div>
            </div>
        </div>

        <!-- 3. VICTORY / GAME OVER SCREEN -->
        <div id="result-screen">
            <canvas id="fireworks-canvas"></canvas>
            <div class="result-box">
                <div id="result-title" class="result-title win">ภารกิจสำเร็จ!</div>
                <div class="result-score">คะแนนของคุณ: <span id="final-score">0</span> / 10</div>
                <button class="btn-restart" id="btn-restart-game">🔄 เล่นอีกครั้ง</button>
            </div>
        </div>

    </div>

    <!-- JAVASCRIPT LOGIC -->
    <script>
        const MASTER_QUESTION_BANK = [
            { q: "345 อ่านว่า?", options: ["สามร้อยสี่สิบห้า", "สามร้อยห้าสิบสี่", "สี่ร้อยสามสิบห้า", "ห้าร้อยสามสิบสี่"], answer: 0 },
            { q: "๗๘๒ อ่านว่า?", options: ["เจ็ดร้อยแปดสิบสอง", "เจ็ดร้อยแปดสิบเอ็ด", "แปดร้อยเจ็ดสิบสอง", "เจ็ดร้อยยี่สิบแปด"], answer: 0 },
            { q: "เก้าร้อยสี่สิบ เขียนอย่างไร?", options: ["940", "904", "490", "944"], answer: 0 },
            { q: "509 อ่านว่า?", options: ["ห้าร้อยเก้า", "ห้าร้อยเก้าสิบ", "เก้าร้อยห้า", "ห้าร้อยห้า"], answer: 0 },
            { q: "๖๑๑ อ่านว่า?", options: ["หกร้อยสิบเอ็ด", "หกร้อยเอ็ด", "หกร้อยหนึ่ง", "หกร้อยสิบ"], answer: 0 },
            { q: "แปดร้อยเจ็ดสิบห้า เลขไทยคือ?", options: ["๘๗๕", "๘๕๗", "๗๘๕", "๕๗๘"], answer: 0 },
            { q: "120 เลขไทยคือ?", options: ["๑๒๐", "๑๐๒", "๒๑๐", "๒๐๑"], answer: 0 },
            { q: "สี่ร้อยสามสิบหก เขียนอย่างไร?", options: ["436", "463", "346", "634"], answer: 0 },
            { q: "๙๙๙ อ่านว่า?", options: ["เก้าร้อยเก้าสิบเก้า", "เก้าร้อยเก้าสิบ", "เก้าร้อยเก้า", "เก้าพันเก้า"], answer: 0 },
            { q: "256 เลขไทยคือ?", options: ["๒๕๖", "๒๖๕", "๕๒๖", "๖๕๒"], answer: 0 },
            { q: "หลักสิบของ 648 คือ?", options: ["4", "6", "8", "40"], answer: 0 },
            { q: "เลข 7 ใน 713 มีค่าเท่าไร?", options: ["700", "70", "7", "710"], answer: 0 },
            { q: "สองร้อยสี่สิบเอ็ด เขียนอย่างไร?", options: ["241", "214", "421", "240"], answer: 0 },
            { q: "๕๐๕ อ่านว่า?", options: ["ห้าร้อยห้า", "ห้าร้อยห้าสิบ", "ห้าร้อยห้าสิบห้า", "ห้าร้อย"], answer: 0 },
            { q: "ข้อใดมีค่ามากที่สุด?", options: ["แปดร้อยเก้าสิบห้า", "890", "๘๐๙", "859"], answer: 0 },
            { q: "ข้อใดมีค่าน้อยที่สุด?", options: ["102", "๑๒๐", "หนึ่งร้อยยี่สิบเอ็ด", "110"], answer: 0 },
            { q: "เลข 0 ใน 904 อยู่หลักใด?", options: ["หลักสิบ", "หลักร้อย", "หลักหน่วย", "หลักพัน"], answer: 0 },
            { q: "หนึ่งพัน เลขไทยคือ?", options: ["๑,๐๐๐", "๑๐๐", "๑๐,๐๐๐", "๑๐"], answer: 0 },
            { q: "๔๓₀ อ่านว่า?", options: ["สี่ร้อยสามสิบ", "สี่ร้อยสาม", "สี่ร้อยสามสิบสาม", "สามร้อยสี่สิบ"], answer: 0 },
            { q: "378 กระจายได้อย่างไร?", options: ["300 + 70 + 8", "300 + 7 + 8", "30 + 70 + 8", "300 + 78"], answer: 0 }
        ];

        const MASTER_BOSS_BANK = [
            { q: "👑 [ศึกบอส] ๘๙๑ ตรงกับข้อใด?", options: ["891 (แปดร้อยเก้าสิบเอ็ด)", "819 (แปดร้อยสิบเก้า)", "981 (เก้าร้อยแปดสิบเอ็ด)", "890 (แปดร้อยเก้าสิบ)"], answer: 0 },
            { q: "👑 [ศึกบอส] ค่าเลข 6 ใน '600' + เลข 5 ใน '50' = ?", options: ["650", "605", "560", "655"], answer: 0 },
            { q: "👑 [ศึกบอส] ๗๐๓ กระจายได้ตามข้อใด?", options: ["๗๐๐ + ๓", "๗๐๐ + ๓๐", "๗๐ + ๓", "๗๐๐ + ๗๐ + ๓"], answer: 0 },
            { q: "👑 [ศึกบอส] จำนวนใดมากกว่า ๔๕₀ แต่น้อยกว่า 460?", options: ["455", "449", "465", "470"], answer: 0 },
            { q: "👑 [ศึกบอส] เก้าร้อยเก้าสิบเก้า + 1 = ?", options: ["๑,๐๐๐", "๙๙๐", "๑,๐๐๑", "๙,๙๙๙"], answer: 0 }
        ];

        class SoundSystem {
            constructor() {
                this.ctx = null;
                this.isMuted = false;
                this.bgmInterval = null;
            }

            init() {
                if (!this.ctx) {
                    const AudioCtx = window.AudioContext || window.webkitAudioContext;
                    this.ctx = new AudioCtx();
                }
                if (this.ctx.state === 'suspended') {
                    this.ctx.resume();
                }
            }

            playTone(freq, type, duration, gainVal = 0.1) {
                if (this.isMuted || !this.ctx) return;
                try {
                    const osc = this.ctx.createOscillator();
                    const gain = this.ctx.createGain();
                    osc.type = type;
                    osc.frequency.setValueAtTime(freq, this.ctx.currentTime);
                    gain.gain.setValueAtTime(gainVal, this.ctx.currentTime);
                    gain.gain.exponentialRampToValueAtTime(0.0001, this.ctx.currentTime + duration);
                    osc.connect(gain);
                    gain.connect(this.ctx.destination);
                    osc.start();
                    osc.stop(this.ctx.currentTime + duration);
                } catch(e) {}
            }

            playClick() { this.playTone(600, 'sine', 0.08, 0.15); }

            playCorrect() {
                if (this.isMuted || !this.ctx) return;
                [523.25, 659.25, 783.99, 1046.50].forEach((f, i) => {
                    setTimeout(() => this.playTone(f, 'triangle', 0.2, 0.2), i * 90);
                });
            }

            playWrong() {
                if (this.isMuted || !this.ctx) return;
                this.playTone(220, 'sawtooth', 0.25, 0.2);
                setTimeout(() => this.playTone(174.61, 'sawtooth', 0.35, 0.2), 150);
            }

            playVictory() {
                if (this.isMuted || !this.ctx) return;
                const notes = [440, 554.37, 659.25, 880, 659.25, 880];
                notes.forEach((f, i) => {
                    setTimeout(() => this.playTone(f, 'sine', 0.3, 0.25), i * 150);
                });
            }

            startBGM() {
                if (this.bgmInterval) return;
                this.bgmInterval = setInterval(() => {
                    if (!this.isMuted && this.ctx) {
                        const birdFreq = 2400 + Math.random() * 800;
                        this.playTone(birdFreq, 'sine', 0.06, 0.03);
                        setTimeout(() => this.playTone(birdFreq + 200, 'sine', 0.08, 0.03), 70);
                    }
                }, 3500);
            }
        }

        const sound = new SoundSystem();

        let currentStage = 0;
        let score = 0;
        let activeQuestions = [];
        let stageResults = new Array(10).fill(null);

        const NODE_POSITIONS = [
            { x: 12, y: 78 },
            { x: 26, y: 65 },
            { x: 22, y: 42 },
            { x: 38, y: 32 },
            { x: 50, y: 55 },
            { x: 62, y: 72 },
            { x: 74, y: 50 },
            { x: 68, y: 28 },
            { x: 82, y: 35 },
            { x: 90, y: 68 }
        ];

        document.addEventListener('DOMContentLoaded', () => {
            createSparkles();
            setupEventListeners();
            window.addEventListener('resize', resizeCanvas);
        });

        function setupEventListeners() {
            document.body.addEventListener('pointerdown', () => {
                sound.init();
                sound.startBGM();
            }, { once: true });

            document.getElementById('toggle-sound').addEventListener('click', () => {
                sound.isMuted = !sound.isMuted;
                document.getElementById('toggle-sound').innerText = sound.isMuted ? '🔇' : '🔊';
            });

            document.getElementById('btn-start-game').addEventListener('click', () => {
                sound.playClick();
                startGame();
            });

            document.getElementById('btn-restart-game').addEventListener('click', () => {
                sound.playClick();
                document.getElementById('result-screen').style.display = 'none';
                document.getElementById('start-screen').style.display = 'flex';
            });
        }

        function createSparkles() {
            const container = document.getElementById('sparkle-container');
            for (let i = 0; i < 20; i++) {
                const s = document.createElement('div');
                s.className = 'sparkle';
                s.style.left = Math.random() * 100 + '%';
                s.style.animationDuration = (3 + Math.random() * 4) + 's';
                s.style.animationDelay = (Math.random() * 3) + 's';
                container.appendChild(s);
            }
        }

        function startGame() {
            currentStage = 0;
            score = 0;
            stageResults.fill(null);
            document.getElementById('current-score').innerText = score;

            activeQuestions = prepareShuffledQuestions();

            document.getElementById('start-screen').style.display = 'none';
            document.getElementById('gameplay-screen').style.display = 'block';

            renderMapNodes();
            resizeCanvas();

            updateHeroPosition(0, () => {
                zoomToStage(0);
            });
        }

        function prepareShuffledQuestions() {
            const shuffledNormal = [...MASTER_QUESTION_BANK].sort(() => 0.5 - Math.random()).slice(0, 9);
            const shuffledBoss = [...MASTER_BOSS_BANK].sort(() => 0.5 - Math.random()).slice(0, 1);
            
            const combined = [...shuffledNormal, ...shuffledBoss];

            return combined.map(qObj => {
                const optionsWithIdx = qObj.options.map((opt, idx) => ({ text: opt, isCorrect: idx === qObj.answer }));
                const shuffledOpts = optionsWithIdx.sort(() => 0.5 - Math.random());
                const newCorrectIdx = shuffledOpts.findIndex(o => o.isCorrect);
                return {
                    q: qObj.q,
                    options: shuffledOpts.map(o => o.text),
                    answer: newCorrectIdx
                };
            });
        }

        function renderMapNodes() {
            const viewport = document.getElementById('map-viewport');
            document.querySelectorAll('.map-node').forEach(n => n.remove());

            NODE_POSITIONS.forEach((pos, idx) => {
                const node = document.createElement('div');
                node.className = `map-node ${idx === 9 ? 'boss-node' : ''}`;
                node.id = `node-${idx}`;
                node.style.left = pos.x + '%';
                node.style.top = pos.y + '%';
                node.innerText = idx === 9 ? '👑' : (idx + 1);
                viewport.appendChild(node);
            });

            const bossNode = NODE_POSITIONS[9];
            const bossEl = document.getElementById('boss-character');
            bossEl.style.left = bossNode.x + '%';
            bossEl.style.top = bossNode.y + '%';
            bossEl.style.display = 'block';
        }

        function resizeCanvas() {
            const canvas = document.getElementById('path-canvas');
            const container = document.getElementById('game-container');
            canvas.width = container.clientWidth;
            canvas.height = container.clientHeight;
            drawMapPaths();
        }

        function drawMapPaths() {
            const canvas = document.getElementById('path-canvas');
            const ctx = canvas.getContext('2d');
            const w = canvas.width;
            const h = canvas.height;

            ctx.clearRect(0, 0, w, h);

            ctx.beginPath();
            NODE_POSITIONS.forEach((pos, i) => {
                const px = (pos.x / 100) * w;
                const py = (pos.y / 100) * h;
                if (i === 0) ctx.moveTo(px, py);
                else ctx.lineTo(px, py);
            });

            ctx.strokeStyle = 'rgba(255, 250, 101, 0.7)';
            ctx.lineWidth = 6;
            ctx.setLineDash([12, 8]);
            ctx.stroke();
        }

        function updateHeroPosition(stageIdx, callback) {
            const hero = document.getElementById('hero-character');
            const pos = NODE_POSITIONS[stageIdx];
            hero.style.left = pos.x + '%';
            hero.style.top = pos.y + '%';

            setTimeout(() => {
                if (callback) callback();
            }, 800);
        }

        function zoomOutToMap(callback) {
            const viewport = document.getElementById('map-viewport');
            viewport.style.transform = 'scale(1) translate(0px, 0px)';
            document.getElementById('quiz-modal').classList.remove('active');

            setTimeout(() => {
                if (callback) callback();
            }, 500);
        }

        function zoomToStage(stageIdx) {
            const viewport = document.getElementById('map-viewport');
            const pos = NODE_POSITIONS[stageIdx];

            const offsetX = (50 - pos.x) * 4;
            const offsetY = (50 - pos.y) * 4;

            viewport.style.transform = `scale(1.4) translate(${offsetX}px, ${offsetY}px)`;

            setTimeout(() => {
                showQuizModal(stageIdx);
            }, 600);
        }

        function showQuizModal(stageIdx) {
            const modal = document.getElementById('quiz-modal');
            const qData = activeQuestions[stageIdx];

            document.getElementById('quiz-stage-title').innerText = stageIdx === 9 ? '👑 ด่านบอส (Level 10)' : `ด่านที่ ${stageIdx + 1}`;
            document.getElementById('quiz-question-text').innerText = qData.q;

            const optsContainer = document.getElementById('quiz-options-container');
            optsContainer.innerHTML = '';

            qData.options.forEach((optText, i) => {
                const btn = document.createElement('button');
                btn.className = 'option-btn';
                btn.innerText = optText;
                btn.onclick = () => handleAnswer(i);
                optsContainer.appendChild(btn);
            });

            modal.classList.add('active');
        }

        function handleAnswer(selectedIdx) {
            const qData = activeQuestions[currentStage];
            const isCorrect = (selectedIdx === qData.answer);
            const nodeEl = document.getElementById(`node-${currentStage}`);

            document.querySelectorAll('.option-btn').forEach(btn => btn.style.pointerEvents = 'none');

            if (isCorrect) {
                sound.playCorrect();
                score++;
                document.getElementById('current-score').innerText = score;
                stageResults[currentStage] = true;
                nodeEl.classList.add('correct');
                nodeEl.innerText = '✓';
            } else {
                sound.playWrong();
                stageResults[currentStage] = false;
                nodeEl.classList.add('wrong');
                nodeEl.innerText = '✗';

                if (currentStage === 9) {
                    triggerBossFireball();
                }
            }

            setTimeout(() => {
                zoomOutToMap(() => {
                    if (currentStage < 9) {
                        currentStage++;
                        updateHeroPosition(currentStage, () => {
                            zoomToStage(currentStage);
                        });
                    } else {
                        setTimeout(showGameResult, 600);
                    }
                });
            }, 600);
        }

        function triggerBossFireball() {
            const fireball = document.getElementById('boss-fireball');
            const hero = document.getElementById('hero-character');
            const boss = document.getElementById('boss-character');

            fireball.style.left = boss.style.left;
            fireball.style.top = boss.style.top;
            fireball.style.opacity = '1';

            setTimeout(() => {
                fireball.style.transition = 'all 0.5s ease-in';
                fireball.style.left = hero.style.left;
                fireball.style.top = hero.style.top;
            }, 50);

            setTimeout(() => {
                fireball.style.opacity = '0';
                fireball.style.transition = 'none';
            }, 600);
        }

        function showGameResult() {
            document.getElementById('gameplay-screen').style.display = 'none';
            const resultScreen = document.getElementById('result-screen');
            const resultTitle = document.getElementById('result-title');
            const finalScore = document.getElementById('final-score');

            finalScore.innerText = score;
            resultScreen.style.display = 'flex';

            if (score >= 7) {
                sound.playVictory();
                resultTitle.innerText = '🎉 ภารกิจสำเร็จ!';
                resultTitle.className = 'result-title win';
                startFireworks();
            } else {
                resultTitle.innerText = '💔 พยายามอีกครั้งนะ!';
                resultTitle.className = 'result-title lose';
            }
        }

        function startFireworks() {
            const canvas = document.getElementById('fireworks-canvas');
            const ctx = canvas.getContext('2d');
            canvas.width = window.innerWidth;
            canvas.height = window.innerHeight;

            const particles = [];
            for (let i = 0; i < 100; i++) {
                particles.push({
                    x: canvas.width / 2,
                    y: canvas.height / 2,
                    vx: (Math.random() - 0.5) * 12,
                    vy: (Math.random() - 0.5) * 12,
                    color: `hsl(${Math.random() * 360}, 100%, 60%)`,
                    radius: Math.random() * 4 + 2,
                    alpha: 1
                });
            }

            function animate() {
                ctx.clearRect(0, 0, canvas.width, canvas.height);
                particles.forEach((p, index) => {
                    p.x += p.vx;
                    p.y += p.vy;
                    p.alpha -= 0.015;
                    ctx.beginPath();
                    ctx.arc(p.x, p.y, p.radius, 0, Math.PI * 2);
                    ctx.fillStyle = p.color;
                    ctx.globalAlpha = Math.max(0, p.alpha);
                    ctx.fill();

                    if (p.alpha <= 0) particles.splice(index, 1);
                });

                if (particles.length > 0) {
                    requestAnimationFrame(animate);
                }
            }
            animate();
        }
    </script>
</body>
